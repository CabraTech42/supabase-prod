# Kong - API gateway do Supabase (self-hosted)
#
# Este arquivo e um TEMPLATE: na subida do container, kong-entrypoint.sh troca
# os marcadores das chaves (consumers abaixo) pelas variaveis ANON_KEY e
# SERVICE_ROLE_KEY do servico.
#
# Autenticacao (igual ao kong.yml oficial do Supabase):
#   - todo pedido precisa do header apikey com a ANON_KEY ou a SERVICE_ROLE_KEY
#     (o supabase-js ja envia sozinho);
#   - /pg (postgres-meta, executa SQL como administrador) so aceita a SERVICE_ROLE_KEY;
#   - /auth/v1/verify, /callback e /authorize ficam abertos (links de e-mail e OAuth).
_format_version: '3.0'
_transform: true

consumers:
  - username: anon
    keyauth_credentials:
      - key: $SUPABASE_ANON_KEY
  - username: service_role
    keyauth_credentials:
      - key: $SUPABASE_SERVICE_KEY

acls:
  - consumer: anon
    group: anon
  - consumer: service_role
    group: admin

services:
  # ---------- Auth (GoTrue): rotas abertas ----------
  - name: auth-v1-open
    url: http://auth:9999/verify
    routes:
      - name: auth-v1-open
        strip_path: true
        paths:
          - /auth/v1/verify
    plugins:
      - name: cors
  - name: auth-v1-open-callback
    url: http://auth:9999/callback
    routes:
      - name: auth-v1-open-callback
        strip_path: true
        paths:
          - /auth/v1/callback
    plugins:
      - name: cors
  - name: auth-v1-open-authorize
    url: http://auth:9999/authorize
    routes:
      - name: auth-v1-open-authorize
        strip_path: true
        paths:
          - /auth/v1/authorize
    plugins:
      - name: cors

  # ---------- Auth (GoTrue): resto, com apikey ----------
  - name: auth-v1
    url: http://auth:9999/
    routes:
      - name: auth-v1-all
        strip_path: true
        paths:
          - /auth/v1/
    plugins:
      - name: cors
      - name: key-auth
        config:
          hide_credentials: false
      - name: acl
        config:
          hide_groups_header: true
          allow:
            - admin
            - anon

  # ---------- REST (PostgREST), com apikey ----------
  - name: rest-v1
    url: http://rest:3000/
    routes:
      - name: rest-v1-all
        strip_path: true
        paths:
          - /rest/v1/
    plugins:
      - name: cors
      - name: key-auth
        config:
          hide_credentials: true
      - name: acl
        config:
          hide_groups_header: true
          allow:
            - admin
            - anon

  # ---------- postgres-meta: SOMENTE service_role ----------
  - name: meta
    url: http://meta:8080/
    routes:
      - name: meta-all
        strip_path: true
        paths:
          - /pg/
    plugins:
      - name: key-auth
        config:
          hide_credentials: false
      - name: acl
        config:
          hide_groups_header: true
          allow:
            - admin
