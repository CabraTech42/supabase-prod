version: "3.8"

# Supabase PROD (portas: 5433/9998/3003/3002)
# Para Coolify: use 00-create-roles.sql + scripts OFICIAIS no initdb.d

services:
  db:
    image: supabase/postgres:15.19.0.004
    container_name: supabase-${COOLIFY_RESOURCE_UUID:-prod}-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: postgres
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      JWT_EXP: 3600
    volumes:
      - db-data:/var/lib/postgresql/data:Z
      - ./initdb.d:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - supabase-prod-net

  auth:
    image: supabase/gotrue:v2.172.1
    container_name: supabase-${COOLIFY_RESOURCE_UUID:-prod}-auth
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      GOTRUE_API_HOST: 0.0.0.0
      GOTRUE_API_PORT: 9999
      GOTRUE_DB_DRIVER: postgres
      GOTRUE_DB_DATABASE_URL: postgres://supabase_auth_admin:${POSTGRES_PASSWORD}@db:5432/postgres
      GOTRUE_SITE_URL: ${SITE_URL}
      GOTRUE_JWT_SECRET: ${JWT_SECRET}
      GOTRUE_API_EXTERNAL_URL: ${API_EXTERNAL_URL}
      GOTRUE_DISABLE_SIGNUP: "false"
      GOTRUE_EXTERNAL_EMAIL_ENABLED: "false"
      GOTRUE_MAILER_AUTOCONFIRM: "true"
      API_EXTERNAL_URL: ${API_EXTERNAL_URL}
      DB_DRIVER: postgres
      DB_DATABASE_URL: postgres://supabase_auth_admin:${POSTGRES_PASSWORD}@db:5432/postgres
      SITE_URL: ${SITE_URL}
      JWT_SECRET: ${JWT_SECRET}
      DISABLE_SIGNUP: "false"
      MAILER_AUTOCONFIRM: "true"
      SMTP_HOST: ""
      SMTP_PORT: ""
      SMTP_USER: ""
      SMTP_PASS: ""
      SMTP_ADMIN_EMAIL: ""
      SMTP_SENDER_NAME: ""
    ports:
      - "9998:9999"
    networks:
      - supabase-prod-net
    labels:
      - traefik.enable=true
      - traefik.http.routers.supa-auth.rule=Host(`auth.cabratech.cloud`)
      - traefik.http.routers.supa-auth.entrypoints=http,https
      - traefik.http.routers.supa-auth.service=supa-auth
      - traefik.http.routers.supa-auth.tls=true
      - traefik.http.routers.supa-auth.tls.certresolver=letsencrypt
      - traefik.http.routers.supa-auth.middlewares=redirect-to-https
      - traefik.http.services.supa-auth.loadbalancer.server.port=9999

  rest:
    image: postgrest/postgrest:v12.2.12
    container_name: supabase-${COOLIFY_RESOURCE_UUID:-prod}-rest
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      PGRST_DB_URI: postgres://authenticator:${POSTGRES_PASSWORD}@db:5432/postgres
      PGRST_DB_SCHEMAS: public
      PGRST_DB_ANON_ROLE: anon
      PGRST_JWT_SECRET: ${JWT_SECRET}
    ports:
      - "3003:3000"
    networks:
      - supabase-prod-net
    labels:
      - traefik.enable=true
      - traefik.http.routers.supa-api.rule=Host(`api.cabratech.cloud`)
      - traefik.http.routers.supa-api.entrypoints=http,https
      - traefik.http.routers.supa-api.service=supa-api
      - traefik.http.routers.supa-api.tls=true
      - traefik.http.routers.supa-api.tls.certresolver=letsencrypt
      - traefik.http.routers.supa-api.middlewares=redirect-to-https
      - traefik.http.services.supa-api.loadbalancer.server.port=3000

  meta:
    image: supabase/postgres-meta:v0.89.0
    container_name: supabase-${COOLIFY_RESOURCE_UUID:-prod}-meta
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      PG_META_PORT: 8080
      PG_META_DB_HOST: db
      PG_META_DB_PORT: 5432
      PG_META_DB_NAME: postgres
      PG_META_DB_USER: postgres
      PG_META_DB_PASSWORD: ${POSTGRES_PASSWORD}
      CRYPTO_KEY: ${PG_META_CRYPTO_KEY}
    networks:
      - supabase-prod-net

  studio:
    image: supabase/studio:2025.05.19-sha-3487831
    container_name: supabase-${COOLIFY_RESOURCE_UUID:-prod}-studio
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      meta:
        condition: service_started
    environment:
      HOSTNAME: "0.0.0.0"
      STUDIO_PG_META_URL: http://meta:8080
      POSTGRES_PORT: 5432
      POSTGRES_HOST: db
      POSTGRES_DB: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_USER_READ_WRITE: postgres
      PG_META_CRYPTO_KEY: ${PG_META_CRYPTO_KEY}
      PGRST_DB_SCHEMAS: public,storage
      DEFAULT_ORGANIZATION_NAME: ${STUDIO_DEFAULT_ORGANIZATION}
      DEFAULT_PROJECT_NAME: ${STUDIO_DEFAULT_PROJECT}
      SUPABASE_URL: ${SUPABASE_URL}
      SUPABASE_PUBLIC_URL: ${SUPABASE_PUBLIC_URL}
      SUPABASE_ANON_KEY: ${ANON_KEY}
      SUPABASE_SERVICE_KEY: ${SERVICE_ROLE_KEY}
      AUTH_JWT_SECRET: ${JWT_SECRET}
    ports:
      - "3002:3000"
    networks:
      - supabase-prod-net
    labels:
      - traefik.enable=true
      - traefik.http.routers.supa-studio.rule=Host(`studio.cabratech.cloud`)
      - traefik.http.routers.supa-studio.entrypoints=http,https
      - traefik.http.routers.supa-studio.service=supa-studio
      - traefik.http.routers.supa-studio.tls=true
      - traefik.http.routers.supa-studio.tls.certresolver=letsencrypt
      - traefik.http.routers.supa-studio.middlewares=redirect-to-https
      - traefik.http.services.supa-studio.loadbalancer.server.port=3000

volumes:
  db-data:

networks:
  supabase-prod-net:
    driver: bridge
